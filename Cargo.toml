[package]
name = "cheryl-lite-llm"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
thiserror = "1.0"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
config = "0.14"
# Rust 的 trait 默认不支持 async 方法，这个库通过宏让 trait 可以定义异步方法。
# 类似 Go 的 interface 方法可以直接返回 channel 或使用 context。
async-trait = "0.1"
toml = "0.8"
once_cell = "1.21.4"
sqlx = { version = "0.7", features = [ "runtime-tokio", "tls-rustls", "postgres", "mysql", "macros", "uuid", "chrono" ] }
uuid = { version = "1.23.1", features = ["serde", "v4"] }
chrono = { version = "0.4.44", features = ["serde"] }
sha2 = "0.10"
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
base64 = "0.22"
tokio-stream = { version = "0.1", features = ["net"] }
futures-util = "0.3"
redis = { version = "0.24", features = ["tokio-comp", "aio", "connection-manager"] }

[dev-dependencies]
tempfile = "3.8"